<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e13">
<title>هوش گارد جاویدان | دستیار هوش مصنوعی</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>">
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<style>
  :root{
    --bg:#0b0e13; --card:#151a22; --card2:#10141b; --line:#242c38;
    --tx:#e8edf3; --mut:#8b98a5;
    --acc:#d8b14a; --acc2:#b9922e; --acc-soft:rgba(216,177,74,.12); --acc-line:rgba(216,177,74,.4);
    --red:#ef4444; --ok:#34d399; --rad:16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; color:var(--tx);
    font-family:Vazirmatn,'Segoe UI',Tahoma,sans-serif;
    background:
      radial-gradient(900px 400px at 85% -10%, rgba(216,177,74,.10), transparent 60%),
      radial-gradient(700px 400px at 10% 110%, rgba(216,177,74,.06), transparent 60%),
      var(--bg);
    display:flex; flex-direction:column; height:100dvh; overflow:hidden;
  }
  header{
    flex:none; display:flex; align-items:center; gap:10px;
    padding:12px 14px; border-bottom:1px solid var(--line);
    background:rgba(16,20,27,.85); backdrop-filter:blur(10px); z-index:5;
  }
  .logo{
    width:40px;height:40px;border-radius:12px;flex:none;
    background:linear-gradient(135deg,var(--acc),var(--acc2));
    display:flex;align-items:center;justify-content:center;font-size:20px;
    box-shadow:0 4px 18px rgba(216,177,74,.35);
  }
  .titles{flex:1;min-width:0;}
  .titles b{font-size:14.5px;display:block;}
  .titles small{color:var(--mut);font-size:10.5px;display:block;margin-top:1px;}
  select{
    background:var(--card2);color:var(--tx);border:1px solid var(--line);
    border-radius:10px;padding:7px 9px;font-family:inherit;font-size:11px;max-width:130px;
  }
  .icon-btn{
    width:36px;height:36px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;
    background:var(--card2);border:1px solid var(--line);color:var(--mut);cursor:pointer;font-size:15px;
    transition:.2s;
  }
  .icon-btn:hover{color:var(--acc);border-color:var(--acc-line);}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--mut);flex:none;}
  .dot.ok{background:var(--ok);box-shadow:0 0 8px rgba(52,211,153,.7);}
  .dot.err{background:var(--red);box-shadow:0 0 8px rgba(239,68,68,.7);}

  #chat{
    flex:1; overflow-y:auto; padding:16px 14px 10px;
    display:flex; flex-direction:column; scroll-behavior:smooth;
  }
  #chat::-webkit-scrollbar{width:5px;}
  #chat::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px;}
  .msg{display:flex;gap:9px;margin:9px 0;max-width:100%;animation:pop .22s ease;}
  .msg.user{justify-content:flex-end;}
  @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98);}to{opacity:1;transform:none;}}
  .avatar{
    width:30px;height:30px;border-radius:10px;flex:none;margin-top:2px;
    background:linear-gradient(135deg,var(--acc),var(--acc2));
    display:flex;align-items:center;justify-content:center;font-size:15px;
    box-shadow:0 2px 10px rgba(216,177,74,.3);
  }
  .bubble{
    max-width:82%; padding:10px 13px; border-radius:var(--rad);
    font-size:13.5px; line-height:1.9; word-wrap:break-word; overflow-wrap:anywhere;
    position:relative;
  }
  .msg.user .bubble{
    background:linear-gradient(135deg,var(--acc),var(--acc2)); color:#191204;
    border-bottom-left-radius:5px;
  }
  .msg.ai .bubble{
    background:var(--card); border:1px solid var(--line);
    border-bottom-right-radius:5px;
  }
  .bubble.err-b{border-color:rgba(239,68,68,.45); background:rgba(239,68,68,.08);}
  .bubble b{color:inherit;}
  .bubble .h{display:block;font-size:14.5px;margin:8px 0 3px;color:var(--acc);}
  .msg.user .bubble .h{color:#191204;}
  .bubble .li{display:block;padding-right:8px;}
  .bubble code{
    background:rgba(0,0,0,.35);border:1px solid var(--line);
    border-radius:5px;padding:1px 5px;font-size:12px;direction:ltr;display:inline-block;
  }
  .msg.user .bubble code{background:rgba(0,0,0,.18);border-color:rgba(0,0,0,.25);}
  .bubble pre{
    background:#0a0d12;border:1px solid var(--line);border-radius:10px;
    padding:10px;overflow-x:auto;margin:8px 0;direction:ltr;text-align:left;
  }
  .bubble pre code{background:none;border:none;padding:0;font-size:12px;color:#c9d6e2;}
  .bubble a{color:var(--acc);}
  .cursor{
    display:inline-block;width:7px;height:15px;background:var(--acc);
    border-radius:2px;vertical-align:middle;margin-right:3px;
    animation:blink 1s steps(2) infinite;
  }
  @keyframes blink{50%{opacity:0;}}
  .typing{display:flex;gap:4px;padding:4px 2px;}
  .typing i{width:6px;height:6px;border-radius:50%;background:var(--acc);animation:tp 1.2s infinite;}
  .typing i:nth-child(2){animation-delay:.2s;}
  .typing i:nth-child(3){animation-delay:.4s;}
  @keyframes tp{0%,60%,100%{transform:none;opacity:.4;}30%{transform:translateY(-5px);opacity:1;}}

  #welcome{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;padding:20px;text-align:center;animation:pop .4s ease;
  }
  #welcome .big{font-size:46px;filter:drop-shadow(0 6px 24px rgba(216,177,74,.45));}
  #welcome h2{margin:0;font-size:18px;}
  #welcome p{margin:0;color:var(--mut);font-size:12px;max-width:320px;line-height:1.9;}
  .chips{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:420px;}
  .chip{
    background:var(--card);border:1px solid var(--line);color:var(--tx);
    border-radius:12px;padding:11px 10px;font-family:inherit;font-size:11.5px;
    cursor:pointer;transition:.2s;text-align:right;line-height:1.6;
  }
  .chip:hover{border-color:var(--acc-line);background:var(--acc-soft);}
  .chip:active{transform:scale(.96);}

  #composer{
    flex:none;padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);background:rgba(16,20,27,.9);backdrop-filter:blur(10px);
  }
  .comp-row{display:flex;align-items:flex-end;gap:8px;max-width:860px;margin:0 auto;}
  #input{
    flex:1;background:var(--card);border:1px solid var(--line);color:var(--tx);
    border-radius:14px;padding:11px 13px;font-family:inherit;font-size:13.5px;line-height:1.7;
    resize:none;max-height:140px;outline:none;transition:border-color .2s;
  }
  #input:focus{border-color:var(--acc-line);}
  #send{
    width:46px;height:46px;border-radius:14px;flex:none;border:none;cursor:pointer;
    background:linear-gradient(135deg,var(--acc),var(--acc2));color:#191204;font-size:19px;
    display:flex;align-items:center;justify-content:center;transition:.2s;
    box-shadow:0 4px 16px rgba(216,177,74,.3);
  }
  #send:disabled{filter:grayscale(.6) brightness(.7);cursor:wait;}
  #send:not(:disabled):active{transform:scale(.93);}
  #send.stop{background:linear-gradient(135deg,#ef4444,#b91c1c);color:#fff;}
  .foot{text-align:center;color:var(--mut);font-size:10px;padding:6px 0 0;}

  #toast{
    position:fixed;bottom:90px;right:50%;transform:translateX(50%) translateY(20px);
    background:var(--card);border:1px solid var(--acc-line);color:var(--tx);
    padding:9px 18px;border-radius:999px;font-size:12px;opacity:0;pointer-events:none;
    transition:.3s;z-index:50;max-width:86vw;text-align:center;
  }
  #toast.show{opacity:1;transform:translateX(50%) translateY(0);}
  @media(min-width:760px){
    #chat,#composer .comp-row,.chips{max-width:860px;margin-left:auto;margin-right:auto;width:100%;}
    header{padding:12px calc((100vw - 860px)/2);}
  }
</style>
</head>
<body>

<header>
  <div class="logo">✨</div>
  <div class="titles">
    <b>هوش گارد جاویدان</b>
    <small>دستیار هوش مصنوعی • <span id="status-txt">در حال اتصال…</span></small>
  </div>
  <span class="dot" id="st-dot"></span>
  <select id="model" title="انتخاب مدل"></select>
  <button class="icon-btn" id="new-chat" title="گفتگوی جدید">🗑️</button>
</header>

<div id="chat">
  <div id="welcome">
    <div class="big">✨</div>
    <h2>چطور می‌تونم کمکتون کنم؟</h2>
    <p>دستیار هوش مصنوعی گارد جاویدان آماده‌ست؛ سوال بپرسید، متن بنویسید، کد بخواهید یا ترجمه کنید.</p>
    <div class="chips">
      <button class="chip">✍️ یه ایمیل رسمی اداری برام بنویس</button>
      <button class="chip">💻 یه اسکریپت پایتون ساده توضیح بده</button>
      <button class="chip">🌍 پایتخت کشورها رو با توضیح بگو</button>
      <button class="chip">📖 یه داستان کوتاه خلاقانه بگو</button>
    </div>
  </div>
</div>

<div id="composer">
  <div class="comp-row">
    <textarea id="input" rows="1" placeholder="پیام خود را بنویسید…"></textarea>
    <button id="send" title="ارسال">➤</button>
  </div>
  <div class="foot">قدرت‌گرفته از هوش مصنوعی رایگان • بدون نیاز به ثبت‌نام • گفتگوها فقط در مرورگر شما ذخیره می‌شوند</div>
</div>

<div id="toast"></div>

<script>
"use strict";
const $=s=>document.querySelector(s);
const chatEl=$("#chat"), inputEl=$("#input"), sendBtn=$("#send");
const SYS="تو «هوش گارد جاویدان» هستی؛ یک دستیار هوشمند، دقیق و خوش‌برخورد فارسی‌زبان. همیشه به فارسی روان و محترمانه پاسخ بده، مگر اینکه کاربر زبان دیگری بخواهد. برای پاسخ‌ها از ساختار تمیز (تیتر، لیست، بلوک کد) استفاده کن و از زیاده‌گویی پرهیز کن.";

let CONV=[], MODEL="openai", controller=null, streaming=false, stick=true;

/* ---------- ذخیره محلی ---------- */
try{
  CONV=JSON.parse(localStorage.getItem("gj_ai_conv")||"[]");
  MODEL=localStorage.getItem("gj_ai_model")||"openai";
}catch(e){ CONV=[]; }
function saveConv(){ try{ localStorage.setItem("gj_ai_conv", JSON.stringify(CONV.slice(-60))); }catch(e){} }

/* ---------- ابزار ---------- */
let toastT=null;
function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"), 3200);
}
function setStatus(mode){
  const d=$("#st-dot"), s=$("#status-txt");
  if(mode==="ok"){ d.className="dot ok"; s.textContent="متصل به سرور"; }
  else if(mode==="direct"){ d.className="dot ok"; s.textContent="اتصال مستقیم"; }
  else if(mode==="err"){ d.className="dot err"; s.textContent="قطع اتصال"; }
  else { d.className="dot"; s.textContent="در حال اتصال…"; }
}

/* ---------- مارک‌داون سبک ---------- */
function md(src){
  const blocks=[];
  src=src.replace(/```(\w*)\r?\n?([\s\S]*?)```/g,(m,l,c)=>{ blocks.push(c.replace(/\n$/,"")); return "\u0000"+(blocks.length-1)+"\u0000"; });
  src=src.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  src=src.replace(/`([^`\n]+)`/g,"<code>$1</code>");
  src=src.replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");
  src=src.replace(/^#{1,4}\s?(.+)$/gm,"<span class='h'>$1</span>");
  src=src.replace(/^\s*[-*•]\s+(.+)$/gm,"<span class='li'>• $1</span>");
  src=src.replace(/^\s*(\d+)[.)]\s+(.+)$/gm,"<span class='li'>$1. $2</span>");
  src=src.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,"<a href='$2' target='_blank' rel='noopener'>$1</a>");
  src=src.replace(/\n/g,"<br>");
  src=src.replace(/\u0000(\d+)\u0000/g,(m,i)=>"<pre><code>"+blocks[+i].replace(/&/g,"&amp;").replace(/</g,"&lt;")+"</code></pre>");
  return src;
}

/* ---------- رندر ---------- */
function scrollDown(force){
  if(force || stick) chatEl.scrollTop=chatEl.scrollHeight;
}
chatEl.addEventListener("scroll",()=>{
  stick = chatEl.scrollHeight - chatEl.scrollTop - chatEl.clientHeight < 70;
});
function addMsg(role, html, extraClass){
  $("#welcome")?.remove();
  const w=document.createElement("div");
  w.className="msg "+(role==="user"?"user":"ai");
  if(role==="user"){
    w.innerHTML='<div class="bubble">'+html+'</div>';
  }else{
    w.innerHTML='<div class="avatar">✨</div><div class="bubble'+(extraClass?" "+extraClass:"")+'">'+html+'</div>';
  }
  chatEl.appendChild(w);
  scrollDown(true);
  return w.querySelector(".bubble");
}
function renderAll(){
  chatEl.querySelectorAll(".msg").forEach(m=>m.remove());
  if(!CONV.length) return;
  $("#welcome")?.remove();
  CONV.forEach(m=>addMsg(m.role, md(m.content)));
}

/* ---------- مدل‌ها ---------- */
async function loadModels(){
  const sel=$("#model");
  let models=[{name:"openai",label:"مدل پیش‌فرض"}];
  try{
    const r=await fetch("/api/models"); const j=await r.json();
    if(j.ok && j.models && j.models.length) models=j.models;
  }catch(e){}
  sel.innerHTML="";
  models.forEach(m=>{
    const o=document.createElement("option");
    o.value=m.name; o.textContent=m.label||m.name;
    sel.appendChild(o);
  });
  if(models.some(m=>m.name===MODEL)) sel.value=MODEL;
  else { MODEL=models[0].name; sel.value=MODEL; }
  sel.onchange=()=>{ MODEL=sel.value; localStorage.setItem("gj_ai_model",MODEL); toast("مدل انتخاب شد: "+(sel.selectedOptions[0]?.textContent||MODEL)); };
}

/* ---------- پروکسی سرور ---------- */
function trimHist(msgs){
  return [{role:"system",content:SYS}].concat(msgs.slice(-24));
}
async function streamServer(messages,onDelta,signal){
  const r=await fetch("/api/chat",{
    method:"POST", signal,
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({messages:trimHist(messages), model:MODEL})
  });
  if(!r.ok){
    let msg="خطای سرور";
    try{ const j=await r.json(); msg=j.error||msg; }catch(e){}
    const err=new Error(msg); err.status=r.status; throw err;
  }
  const rd=r.body.getReader(), dec=new TextDecoder();
  while(true){
    const {done,value}=await rd.read();
    if(done) break;
    const t=dec.decode(value,{stream:true});
    if(t) onDelta(t);
  }
}
/* ---------- مسیر مستقیم (پشتیبان) ---------- */
async function streamDirect(messages,onDelta,signal){
  const r=await fetch("https://text.pollinations.ai/openai",{
    method:"POST", signal, referrerPolicy:"no-referrer",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:MODEL, messages:trimHist(messages), stream:true})
  });
  if(!r.ok) throw new Error("HTTP "+r.status);
  const rd=r.body.getReader(), dec=new TextDecoder();
  let buf="";
  while(true){
    const {done,value}=await rd.read();
    if(done) break;
    buf+=dec.decode(value,{stream:true});
    let i;
    while((i=buf.indexOf("\n"))>=0){
      const line=buf.slice(0,i).trim(); buf=buf.slice(i+1);
      if(!line.startsWith("data:")) continue;
      const d=line.slice(5).trim();
      if(d==="[DONE]") continue;
      try{
        const j=JSON.parse(d);
        if(j.error) throw new Error(String(j.error).slice(0,80));
        const t=((j.choices&&j.choices[0]&&j.choices[0].delta)||{}).content||"";
        if(t) onDelta(t);
      }catch(e){ if(e instanceof SyntaxError) continue; throw e; }
    }
  }
}

/* ---------- ارسال ---------- */
async function send(text){
  if(streaming) return;
  text=(text||"").trim();
  if(!text) return;
  CONV.push({role:"user",content:text}); saveConv();
  addMsg("user", md(text));
  inputEl.value=""; autoGrow();
  streaming=true; stick=true;
  controller=new AbortController();
  sendBtn.classList.add("stop"); sendBtn.textContent="■";
  const bubble=addMsg("ai",'<span class="typing"><i></i><i></i><i></i></span>');
  let acc="", got=false;
  const onDelta=t=>{
    acc+=t;
    if(!got){ got=true; }
    bubble.innerHTML=md(acc)+'<span class="cursor"></span>';
    scrollDown();
  };
  let failed=null;
  try{
    await streamServer(CONV,onDelta,controller.signal);
    setStatus("ok");
  }catch(e1){
    if(controller.signal.aborted){ /* کاربر متوقف کرد */ }
    else if(!got){
      try{
        await streamDirect(CONV,onDelta,controller.signal);
        setStatus("direct");
      }catch(e2){
        if(!controller.signal.aborted) failed=(e2&&e2.message)||"خطا";
      }
    } else setStatus("err");
  }
  streaming=false; controller=null;
  sendBtn.classList.remove("stop"); sendBtn.innerHTML="➤";
  if(got){
    bubble.innerHTML=md(acc);
    CONV.push({role:"assistant",content:acc}); saveConv();
  }else if(failed){
    bubble.classList.add("err-b");
    bubble.innerHTML="⚠️ "+(failed==="rate" ? "تعداد درخواست‌ها زیاد است؛ چند لحظه صبر کنید و دوباره بفرستید." : "پاسخی دریافت نشد. اتصال اینترنت یا سرویس هوش مصنوعی را بررسی کنید و دوباره تلاش کنید.<br><small style='opacity:.7'>"+failed+"</small>");
    CONV.pop(); saveConv();
  }else{
    bubble.classList.add("err-b");
    bubble.innerHTML="⚠️ درخواست متوقف شد.";
    if(acc){ CONV.push({role:"assistant",content:acc}); saveConv(); bubble.innerHTML=md(acc); }
    else CONV.pop();
    saveConv();
  }
  scrollDown();
}

sendBtn.addEventListener("click",()=>{
  if(streaming){ controller&&controller.abort(); return; }
  send(inputEl.value);
});
inputEl.addEventListener("keydown",e=>{
  if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); if(!streaming) send(inputEl.value); }
});
function autoGrow(){
  inputEl.style.height="auto";
  inputEl.style.height=Math.min(inputEl.scrollHeight,140)+"px";
}
inputEl.addEventListener("input",autoGrow);

document.querySelectorAll(".chip").forEach(c=>{
  c.addEventListener("click",()=>{ if(!streaming) send(c.textContent.replace(/^\S+\s/,"")); });
});

$("#new-chat").addEventListener("click",()=>{
  if(streaming){ toast("اول پاسخ را متوقف کنید",); controller&&controller.abort(); return; }
  if(!CONV.length) return;
  if(!confirm("گفتگوی فعلی پاک شود؟")) return;
  CONV=[]; saveConv();
  chatEl.querySelectorAll(".msg").forEach(m=>m.remove());
  if(!$("#welcome")) location.reload();
  toast("گفتگوی جدید آغاز شد ✨");
});

/* ---------- شروع ---------- */
(async function init(){
  renderAll();
  scrollDown(true);
  await loadModels();
  try{
    const r=await fetch("/api/health"); const j=await r.json();
    setStatus(j.ok? "ok":"err");
  }catch(e){ setStatus("err"); }
})();
</script>
</body>
</html>
